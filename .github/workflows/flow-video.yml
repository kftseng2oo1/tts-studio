name: z1 流年有聲影片
on:
  push:
    paths: ["jobs/**/flow.json", "flow.py", "flow_video.mjs", ".github/workflows/flow-video.yml"]
  workflow_dispatch:
    inputs:
      job:   { description: "Job folder name (blank = all changed)", required: false, default: "" }
      force: { description: "Re-render even if unchanged", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
      - run: pip install edge-tts==7.*
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: python flow.py ${{ github.event.inputs.job }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit video
        run: |
          git config user.name "tts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Render flow video [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
