name: TTS render
on:
  push:
    paths: ["jobs/**/script.json", "tts.py", ".github/workflows/tts.yml"]
  workflow_dispatch:
    inputs:
      job:   { description: "Job folder name (blank = all changed)", required: false, default: "" }
      force: { description: "Re-render even if unchanged", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts==7.*
      - run: python tts.py ${{ github.event.inputs.job }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit audio
        run: |
          git config user.name "tts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Render audio [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
